upstream noc_app {
    server app:3000;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;

    # Masque la version de Nginx dans les réponses
    server_tokens off;

    client_max_body_size 50m;

    # ── Security headers ─────────────────────────────────────────────────────
    add_header X-Frame-Options          "SAMEORIGIN"                          always;
    add_header X-Content-Type-Options   "nosniff"                             always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin"     always;
    add_header X-XSS-Protection         "1; mode=block"                       always;
    add_header Permissions-Policy       "camera=(self), microphone=(self), geolocation=(), payment=()" always;
    # HSTS activé uniquement si vous ajoutez TLS devant (décommenter alors)
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    # ─────────────────────────────────────────────────────────────────────────

    location / {
        proxy_pass http://noc_app;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }
}
